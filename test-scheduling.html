<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduling Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        pre { background: white; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Ephemeralist Scheduling System Test</h1>
    <p>This page tests the conflict detection and scheduling utilities.</p>
    
    <div id="test-results"></div>
    
    <script type="module">
        // Mock Task interface for testing
        const createTask = (id, content, startTime, duration, date = '2024-01-22') => ({
            id,
            content,
            isCompleted: false,
            depth: 0,
            tag: 'Execution',
            collapsed: false,
            meta: {
                created_at: new Date().toISOString(),
                deadlineISO: date,
                startTime,
                durationMinutes: duration
            }
        });

        // Test data
        const testTasks = [
            createTask('1', 'Morning standup', '09:00', 30),
            createTask('2', 'Code review', '10:00', 60),
            createTask('3', 'Lunch meeting', '12:00', 90)
        ];

        // Import scheduling utilities (would need to be bundled in real app)
        const timeToMinutes = (time) => {
            const [hours, minutes] = time.split(':').map(Number);
            return hours * 60 + minutes;
        };

        const minutesToTime = (minutes) => {
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
        };

        const calculateEndTime = (startTime, durationMinutes) => {
            const startMinutes = timeToMinutes(startTime);
            const endMinutes = startMinutes + durationMinutes;
            return minutesToTime(endMinutes);
        };

        const timeSlotsOverlap = (start1, end1, start2, end2) => {
            const start1Min = timeToMinutes(start1);
            const end1Min = timeToMinutes(end1);
            const start2Min = timeToMinutes(start2);
            const end2Min = timeToMinutes(end2);
            return start1Min < end2Min && start2Min < end1Min;
        };

        const getScheduledSlots = (tasks, dateISO) => {
            return tasks
                .filter(t => 
                    t.meta.deadlineISO === dateISO && 
                    t.meta.startTime && 
                    t.meta.durationMinutes &&
                    !t.isCompleted
                )
                .map(t => ({
                    start: t.meta.startTime,
                    end: calculateEndTime(t.meta.startTime, t.meta.durationMinutes),
                    content: t.content,
                    taskId: t.id
                }))
                .sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));
        };

        const checkSchedulingConflict = (tasks, dateISO, proposedStartTime, proposedDuration, excludeTaskId) => {
            const existingSlots = getScheduledSlots(tasks, dateISO)
                .filter(slot => slot.taskId !== excludeTaskId);
            
            const proposedEnd = calculateEndTime(proposedStartTime, proposedDuration);
            const conflictingTasks = [];
            
            for (const slot of existingSlots) {
                if (timeSlotsOverlap(proposedStartTime, proposedEnd, slot.start, slot.end)) {
                    const conflictingTask = tasks.find(t => t.id === slot.taskId);
                    if (conflictingTask) {
                        conflictingTasks.push(conflictingTask);
                    }
                }
            }

            return {
                hasConflict: conflictingTasks.length > 0,
                conflictingTasks
            };
        };

        // Test runner
        const runTest = (name, testFn) => {
            try {
                const result = testFn();
                const div = document.createElement('div');
                div.className = `test-result ${result.pass ? 'pass' : 'fail'}`;
                div.innerHTML = `
                    <strong>${result.pass ? '✅' : '❌'} ${name}</strong><br>
                    ${result.message}
                    ${result.details ? `<pre>${result.details}</pre>` : ''}
                `;
                document.getElementById('test-results').appendChild(div);
            } catch (error) {
                const div = document.createElement('div');
                div.className = 'test-result fail';
                div.innerHTML = `<strong>❌ ${name}</strong><br>Error: ${error.message}`;
                document.getElementById('test-results').appendChild(div);
            }
        };

        // Run tests
        runTest('Time Conversion', () => {
            const minutes = timeToMinutes('14:30');
            const time = minutesToTime(870);
            return {
                pass: minutes === 870 && time === '14:30',
                message: `timeToMinutes('14:30') = ${minutes}, minutesToTime(870) = '${time}'`
            };
        });

        runTest('End Time Calculation', () => {
            const endTime = calculateEndTime('09:00', 90);
            return {
                pass: endTime === '10:30',
                message: `calculateEndTime('09:00', 90) = '${endTime}'`
            };
        });

        runTest('No Conflict Detection', () => {
            const conflict = checkSchedulingConflict(testTasks, '2024-01-22', '14:00', 60);
            return {
                pass: !conflict.hasConflict,
                message: `Scheduling at 14:00 should not conflict`,
                details: `Conflicts: ${conflict.conflictingTasks.length}`
            };
        });

        runTest('Direct Conflict Detection', () => {
            const conflict = checkSchedulingConflict(testTasks, '2024-01-22', '09:15', 30);
            return {
                pass: conflict.hasConflict && conflict.conflictingTasks.length === 1,
                message: `Scheduling at 09:15 should conflict with morning standup`,
                details: `Conflicting tasks: ${conflict.conflictingTasks.map(t => t.content).join(', ')}`
            };
        });

        runTest('Partial Overlap Detection', () => {
            const conflict = checkSchedulingConflict(testTasks, '2024-01-22', '10:30', 60);
            return {
                pass: conflict.hasConflict,
                message: `Scheduling at 10:30 should conflict with code review`,
                details: `Conflicting tasks: ${conflict.conflictingTasks.map(t => t.content).join(', ')}`
            };
        });

        runTest('Schedule Slots Generation', () => {
            const slots = getScheduledSlots(testTasks, '2024-01-22');
            const expected = 3;
            return {
                pass: slots.length === expected,
                message: `Should find ${expected} scheduled slots`,
                details: `Found slots: ${slots.map(s => `${s.start}-${s.end}: ${s.content}`).join(', ')}`
            };
        });

        // Add summary
        setTimeout(() => {
            const results = document.querySelectorAll('.test-result');
            const passed = document.querySelectorAll('.test-result.pass').length;
            const total = results.length;
            
            const summary = document.createElement('div');
            summary.className = `test-result ${passed === total ? 'pass' : 'info'}`;
            summary.innerHTML = `<strong>📊 Test Summary: ${passed}/${total} tests passed</strong>`;
            document.getElementById('test-results').appendChild(summary);
        }, 100);
    </script>
</body>
</html>
