<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environment Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Environment Variables Debug</h1>
    <div id="env-info"></div>

    <script type="module">
        const envInfo = document.getElementById('env-info');
        
        const envData = {
            'VITE_OPENROUTER_API_KEY': import.meta.env.VITE_OPENROUTER_API_KEY,
            'VITE_SUPABASE_URL': import.meta.env.VITE_SUPABASE_URL,
            'VITE_SUPABASE_ANON_KEY': import.meta.env.VITE_SUPABASE_ANON_KEY,
            'All Environment Variables': import.meta.env
        };

        envInfo.innerHTML = `
            <h2>Environment Check:</h2>
            <pre>${JSON.stringify(envData, null, 2)}</pre>
            
            <h2>OpenRouter API Key Status:</h2>
            <p>Present: ${!!import.meta.env.VITE_OPENROUTER_API_KEY}</p>
            <p>Length: ${import.meta.env.VITE_OPENROUTER_API_KEY?.length || 0}</p>
            <p>Starts with: ${import.meta.env.VITE_OPENROUTER_API_KEY?.substring(0, 15) || 'N/A'}</p>
        `;
    </script>
</body>
</html>
